[package]
name = "aula-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing Aula school platform data to LLM clients"

[dependencies]
aula-api = { path = "../aula-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
